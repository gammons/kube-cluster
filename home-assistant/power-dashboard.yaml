title: Power
views:
- title: Power
  path: power
  icon: mdi:flash
  type: sections
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Whole house
      icon: mdi:home-lightning-bolt
    - type: gauge
      entity: sensor.main_power_minute_average
      name: Using now
      unit: W
      min: 0
      max: 10000
      needle: true
      severity:
        green: 0
        yellow: 3000
        red: 6000
    - type: tile
      entity: sensor.main_energy_today
      name: Used today
    - type: tile
      entity: sensor.main_energy_today_cost
      name: Cost today
    - type: tile
      entity: sensor.main_energy_this_month
      name: Used this month
    - type: tile
      entity: sensor.main_power_minute_average
      name: Power now
  - type: grid
    cards:
    - type: heading
      heading: Circuits now
      icon: mdi:flash
    - type: tile
      entity: sensor.main_ac_power_minute_average
      name: Main AC
    - type: tile
      entity: sensor.ev_charger_power_minute_average
      name: EV charger
    - type: tile
      entity: sensor.water_heater_power_minute_average
      name: Water heater
    - type: tile
      entity: sensor.den_office_power_minute_average
      name: Den + office
    - type: tile
      entity: sensor.basement_kit_fan_power_minute_average
      name: Basement kit fan
    - type: tile
      entity: sensor.fridge_power_minute_average
      name: Fridge
    - type: tile
      entity: sensor.kitchen_ac_power_minute_average
      name: Kitchen AC
    - type: tile
      entity: sensor.master_bedroom_power_minute_average
      name: Master bedroom
    - type: tile
      entity: sensor.unknown_power_minute_average
      name: Unknown circuit
    - type: tile
      entity: sensor.dishwasher_disposal_power_minute_average
      name: Dishwasher/disposal
    - type: tile
      entity: sensor.espresso_machine_power_minute_average
      name: Espresso machine
    - type: tile
      entity: sensor.master_bath_power_minute_average
      name: Master bath
    - type: tile
      entity: sensor.center_hall_power_minute_average
      name: Center hall
    - type: tile
      entity: sensor.downstairs_bath_power_minute_average
      name: Downstairs bath
    - type: tile
      entity: sensor.washer_dryer_power_minute_average
      name: Washer/dryer
    - type: tile
      entity: sensor.deck_side_gfi_pond_light_power_minute_average
      name: Deck GFI / pond light
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Live power flow
      icon: mdi:transit-connection-variant
    - type: power-sankey
      grid_options:
        columns: full
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Last 24 hours
      icon: mdi:chart-line
    - type: history-graph
      title: Whole house
      hours_to_show: 24
      entities:
      - entity: sensor.main_power_minute_average
        name: Whole house
      grid_options:
        columns: full
    - type: history-graph
      title: Big loads
      hours_to_show: 24
      entities:
      - entity: sensor.main_ac_power_minute_average
        name: Main AC
      - entity: sensor.kitchen_ac_power_minute_average
        name: Kitchen AC
      - entity: sensor.water_heater_power_minute_average
        name: Water heater
      - entity: sensor.ev_charger_power_minute_average
        name: EV charger
      - entity: sensor.fridge_power_minute_average
        name: Fridge
      - entity: sensor.basement_kit_fan_power_minute_average
        name: Basement kit fan
      grid_options:
        columns: full
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Usage history
      icon: mdi:chart-bar-stacked
    - type: energy-date-selection
      grid_options:
        columns: full
    - type: energy-devices-detail-graph
      title: Usage by circuit
      grid_options:
        columns: full
    - type: energy-devices-graph
      title: Circuit totals for period
      grid_options:
        columns: full
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Last 30 days
      icon: mdi:calendar-month
    - type: statistics-graph
      title: Whole house kWh per day
      chart_type: bar
      period: day
      days_to_show: 30
      stat_types:
      - change
      entities:
      - entity: sensor.main_energy_today
        name: Whole house
      grid_options:
        columns: full
