service:
  type: NodePort
  port: 8124

# Pin to the node where the SONOFF Zigbee USB dongle is functional.
# Proxmox passes the USB device to all VMs, but only one can bind cdc_acm.
# Check which node has /dev/ttyACM0 and update this accordingly.
nodeSelector:
  kubernetes.io/hostname: k3s-node-1

podSecurityContext:
  privileged: true

securityContext:
  privileged: true

persistence:
  enabled: true
  storageClass: "longhorn"
  accessMode: "ReadWriteOnce"
  existingVolume: home-assistant-home-assistant-0

additionalVolumes:
  - hostPath:
      path: >-
        /dev/serial/by-id/usb-ITEAD_SONOFF_Zigbee_3.0_USB_Dongle_Plus_V2_20230803102536-if00
      type: CharDevice
    name: usb

additionalMounts:
  - mountPath: /dev/ttyACM0
    name: usb
