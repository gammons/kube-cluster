apiVersion: v1
kind: Secret
metadata:
  name: cliproxyapi-config
  namespace: cliproxyapi
type: Opaque
stringData:
  config.yaml: |
    host: ""
    port: 8317
    auth-dir: "/auth"

    api-keys:
      - "REPLACE_WITH_LONG_RANDOM_KEY"

    routing:
      strategy: "fill-first"

    quota-exceeded:
      switch-project: true
      switch-preview-model: false

    request-retry: 3
    max-retry-credentials: 5
    max-retry-interval: 30

    remote-management:
      allow-remote: false
      secret-key: ""
