apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cliproxyapi
  template:
    metadata:
      labels:
        app: cliproxyapi
    spec:
      containers:
        - name: cliproxyapi
          image: eceasy/cli-proxy-api:v7.3.15
          command:
            - /CLIProxyAPI/CLIProxyAPI
            - -config
            - /config/config.yaml
          ports:
            - name: http
              containerPort: 8317
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: auth
              mountPath: /auth
      volumes:
        - name: config
          secret:
            secretName: cliproxyapi-config
            optional: false
        - name: auth
          persistentVolumeClaim:
            claimName: cliproxyapi-auth
