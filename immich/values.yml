---
# Shared across every Immich component.
defaultPodOptions:
  dnsConfig:
    options:
      # Cluster search list is "... lan rya-scala.ts.net" with ndots:5, which
      # triggers the musl/Alpine resolution bug Immich documents. Internal
      # references below are fully qualified; this fixes external lookups.
      - name: ndots
        value: "1"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              # k3s-node-2 is at 83% memory requests / 216% memory limits.
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["k3s-node-2"]

controllers:
  main:
    containers:
      main:
        image:
          tag: v3.2.0
        # DB_* deliberately NOT set here: this block fans out to every
        # component. Postgres credentials live under `server` only.
        env:
          REDIS_HOSTNAME: immich-valkey.immich.svc.cluster.local
          IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning.immich.svc.cluster.local:3003

immich:
  metrics:
    enabled: true
  persistence:
    library:
      existingClaim: immich-library
  configuration:
    storageTemplate:
      enabled: true
      hashVerificationEnabled: true
      template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"
    machineLearning:
      # Enabled 2026-09-17, after the bulk import and thumbnail generation
      # completed. These were off during the import so CPU-only inference did
      # not compete with ingest on a GPU-less cluster.
      #
      # ocr stays OFF deliberately — it is not an oversight. It is a separate
      # inference pass over every asset, and text-in-image search is the ML
      # output most people never use. Turn it on only after Smart Search and
      # Face Detection have fully drained, and only if you actually want it.
      #
      # duplicateDetection is cheap once CLIP embeddings exist because it
      # reuses them, so it goes on with clip rather than separately.
      #
      # These are READ-ONLY in the admin UI because IMMICH_CONFIG_FILE is set.
      # Change them here, `helm upgrade`, then `rollout restart deploy/immich-server`
      # — the chart puts no config checksum on the pod template, so the upgrade
      # alone updates the ConfigMap while the process keeps the old values.
      clip:
        enabled: true
      facialRecognition:
        enabled: true
      ocr:
        enabled: false
      duplicateDetection:
        enabled: true
    backup:
      database:
        # Default true: writes a nightly pg_dump at 02:00 into /data/backups,
        # which is immich-library — the one volume deliberately excluded from
        # Velero because Google Photos is the backup. A recovery path on an
        # un-backed-up volume looks like safety without being it, and it puts
        # write load on an SMR disk. immich-pgdump is the single documented path.
        enabled: false
    job:
      # Library lives on a Seagate ST8000DM004 (SMR, ~15ms avg read wait)
      # over NFS. Default 3 turns thumbnailing into random-write thrash.
      thumbnailGeneration:
        concurrency: 1
    integrityChecks:
      # missingFiles and untrackedFiles are cheap metadata comparisons and stay
      # on. checksumFiles at the default percentageLimit 1.0 re-reads the entire
      # library nightly at 03:00 under a 1h cap it cannot meet on SMR over NFS,
      # so it grinds every night and never completes.
      checksumFiles:
        enabled: false

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          # Without these valkey is BestEffort QoS, making it the first pod
          # evicted under node pressure — and it holds the Immich job queue.
          # Requests stay at 256Mi so QoS stays Burstable and scheduling is
          # unchanged; only the ceiling moves. That 2Gi ceiling is a deliberate
          # deviation from the resource table in
          # docs/superpowers/specs/2026-09-12-immich-homelab-design.md, which
          # specifies 512Mi. valkey runs maxmemory 0 with maxmemory-policy
          # noeviction, so it cannot self-evict — it grows until the kernel
          # OOM-kills it. Persistence is RDB-only (appendonly no), so an
          # OOMKill loses up to 60s of queue writes, meaning queued BullMQ jobs
          # vanish mid-import. An eviction policy is not the alternative here:
          # BullMQ requires noeviction, and allkeys-lru would silently evict
          # queue entries and corrupt queue state — worse than a visible
          # OOMKill. More memory is the only correct fix. Sizing: ~200k assets,
          # and immich-go's --pause-immich-jobs (default true) means metadata
          # and thumbnail jobs accumulate unprocessed in the waiting list —
          # ~400k jobs × ~400B ≈ 160MB raw, ≈ 320MB+ with Redis overhead. 512Mi
          # leaves too little margin for a multi-hour unattended import.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-valkey-data

server:
  persistence:
    # Velero's fs-backup (kopia) can only read a PVC that is mounted by a
    # Running pod. immich-pgdump is otherwise mounted only by the pgdump
    # CronJob pod, which is phase=Succeeded hours before the 06:00 backup, so
    # Velero skipped it ("pod is not running") and the only database recovery
    # path was never captured. Mounting it into the always-running server pod
    # makes it visible. RWX on the nfs class, so the second mount is free.
    # readOnly: Immich must never be able to write to or delete the dumps.
    # Deliberately NOT added to backup-volumes-excludes below — the point is
    # for Velero to back this one up.
    immich-pgdump:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-pgdump
      globalMounts:
        - path: /dumps
          readOnly: true
  service:
    main:
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "immich"
  controllers:
    main:
      pod:
        # Pinned to node-1 for the same reason as machine-learning: node-3 is
        # at 90% memory from non-immich workloads and must stay reserved for
        # immich-postgres, which cannot move. Left unpinned, the scheduler put
        # this pod on node-3 on its next rollout, where its ~4Gi working set
        # would have risked the node OOM-killer taking Postgres with it.
        nodeSelector:
          kubernetes.io/hostname: k3s-node-1
        annotations:
          backup.velero.io/backup-volumes-excludes: data
      containers:
        main:
          # Scoped to the server: machine-learning parses untrusted uploaded
          # files and has no Postgres client library, so it must not hold
          # these credentials. Valkey never uses them either.
          env:
            # V8 sizes its old-space heap from *detected system memory* and
            # does not read the cgroup limit, so on an 11.7Gi node it happily
            # grows past the 6Gi container limit and gets OOM-killed instead
            # of collecting. Enabling ML made this fire every ~30 min
            # (exit 137, plus a node-level SystemOOM naming immich as victim).
            # Bounding old-space at 3Gi makes V8 GC on its own well before the
            # cgroup limit. Non-heap allocations (sharp, native buffers) sit
            # outside this figure, which is why it is 3Gi and not 6Gi.
            NODE_OPTIONS: "--max-old-space-size=3072"
            DB_HOSTNAME: immich-postgres.immich.svc.cluster.local
            DB_PORT: "5432"
            DB_DATABASE_NAME: immich
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-postgres
                  key: POSTGRES_USER
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-postgres
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          # The chart defaults these to timeoutSeconds: 1 / failureThreshold: 3
          # / periodSeconds: 10, so 30s of slow responses kills the container.
          # During the Takeout import that killed immich-server four times
          # (exit 143, "Liveness probe failed: context deadline exceeded") —
          # a Node.js event loop servicing concurrent uploads, hashing and DB
          # writes cannot reliably answer /api/server/ping inside one second.
          # Each kill dropped the uploads in flight at that moment.
          # 5 failures x 30s at a 10s timeout means a kill now needs ~150s of
          # genuine unresponsiveness, which is a real hang rather than load.
          # startupProbe is left alone: it already allows 30 x 10s.
          probes:
            liveness:
              spec:
                timeoutSeconds: 10
                failureThreshold: 5
                periodSeconds: 30
            readiness:
              spec:
                timeoutSeconds: 10
                failureThreshold: 5
                periodSeconds: 30

machine-learning:
  controllers:
    main:
      pod:
        # Pinned to node-1, with immich-server. Measured, not assumed:
        #   node-1  9% CPU, 38% memory (4.5Gi used of 11.7Gi)
        #   node-3 62% CPU, 90% memory (10.8Gi used) - ~8Gi of it NON-immich
        # node-3 is the loaded node and must stay reserved for immich-postgres,
        # which is pinned there by its local-path PV and cannot move. Putting
        # ML (4 CPU) or the server (up to 4Gi) there risks the node OOM-killer
        # taking Postgres, which is a far worse failure than the one this is
        # fixing. node-1 has 8 CPUs at 9% and ~7Gi free, so it absorbs both.
        # The real fix for the OOM was bounding V8's heap (NODE_OPTIONS on the
        # server), not separating the pods - co-location was never the cause.
        # Safe to move: immich-ml-cache is RWX on the nfs class, not node-local.
        # ANDs with the defaultPodOptions nodeAffinity that excludes node-2.
        nodeSelector:
          kubernetes.io/hostname: k3s-node-1
        annotations:
          backup.velero.io/backup-volumes-excludes: cache
      containers:
        main:
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-ml-cache
