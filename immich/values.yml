---
# Shared across every Immich component.
defaultPodOptions:
  dnsConfig:
    options:
      # Cluster search list is "... lan rya-scala.ts.net" with ndots:5, which
      # triggers the musl/Alpine resolution bug Immich documents. Internal
      # references below are fully qualified; this fixes external lookups.
      - name: ndots
        value: "1"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              # k3s-node-2 is at 83% memory requests / 216% memory limits.
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["k3s-node-2"]

controllers:
  main:
    containers:
      main:
        image:
          tag: v3.2.0
        # DB_* deliberately NOT set here: this block fans out to every
        # component. Postgres credentials live under `server` only.
        env:
          REDIS_HOSTNAME: immich-valkey.immich.svc.cluster.local
          IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning.immich.svc.cluster.local:3003

immich:
  metrics:
    enabled: true
  persistence:
    library:
      existingClaim: immich-library
  configuration:
    storageTemplate:
      enabled: true
      hashVerificationEnabled: true
      template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"
    machineLearning:
      # Disabled for the bulk import; re-enabled in Task 11.
      # All four default to true in v3.2.0's config.dto.js. ocr in particular
      # runs CPU-only inference on every asset, and there is no GPU here.
      clip:
        enabled: false
      facialRecognition:
        enabled: false
      ocr:
        enabled: false
      duplicateDetection:
        enabled: false
    backup:
      database:
        # Default true: writes a nightly pg_dump at 02:00 into /data/backups,
        # which is immich-library — the one volume deliberately excluded from
        # Velero because Google Photos is the backup. A recovery path on an
        # un-backed-up volume looks like safety without being it, and it puts
        # write load on an SMR disk. immich-pgdump is the single documented path.
        enabled: false
    job:
      # Library lives on a Seagate ST8000DM004 (SMR, ~15ms avg read wait)
      # over NFS. Default 3 turns thumbnailing into random-write thrash.
      thumbnailGeneration:
        concurrency: 1
    integrityChecks:
      # missingFiles and untrackedFiles are cheap metadata comparisons and stay
      # on. checksumFiles at the default percentageLimit 1.0 re-reads the entire
      # library nightly at 03:00 under a 1h cap it cannot meet on SMR over NFS,
      # so it grinds every night and never completes.
      checksumFiles:
        enabled: false

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          # Without these valkey is BestEffort QoS, making it the first pod
          # evicted under node pressure — and it holds the Immich job queue.
          # Requests stay at 256Mi so QoS stays Burstable and scheduling is
          # unchanged; only the ceiling moves. That 2Gi ceiling is a deliberate
          # deviation from the resource table in
          # docs/superpowers/specs/2026-09-12-immich-homelab-design.md, which
          # specifies 512Mi. valkey runs maxmemory 0 with maxmemory-policy
          # noeviction, so it cannot self-evict — it grows until the kernel
          # OOM-kills it. Persistence is RDB-only (appendonly no), so an
          # OOMKill loses up to 60s of queue writes, meaning queued BullMQ jobs
          # vanish mid-import. An eviction policy is not the alternative here:
          # BullMQ requires noeviction, and allkeys-lru would silently evict
          # queue entries and corrupt queue state — worse than a visible
          # OOMKill. More memory is the only correct fix. Sizing: ~200k assets,
          # and immich-go's --pause-immich-jobs (default true) means metadata
          # and thumbnail jobs accumulate unprocessed in the waiting list —
          # ~400k jobs × ~400B ≈ 160MB raw, ≈ 320MB+ with Redis overhead. 512Mi
          # leaves too little margin for a multi-hour unattended import.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-valkey-data

server:
  persistence:
    # Velero's fs-backup (kopia) can only read a PVC that is mounted by a
    # Running pod. immich-pgdump is otherwise mounted only by the pgdump
    # CronJob pod, which is phase=Succeeded hours before the 06:00 backup, so
    # Velero skipped it ("pod is not running") and the only database recovery
    # path was never captured. Mounting it into the always-running server pod
    # makes it visible. RWX on the nfs class, so the second mount is free.
    # readOnly: Immich must never be able to write to or delete the dumps.
    # Deliberately NOT added to backup-volumes-excludes below — the point is
    # for Velero to back this one up.
    immich-pgdump:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-pgdump
      globalMounts:
        - path: /dumps
          readOnly: true
  service:
    main:
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "immich"
  controllers:
    main:
      pod:
        annotations:
          backup.velero.io/backup-volumes-excludes: data
      containers:
        main:
          # Scoped to the server: machine-learning parses untrusted uploaded
          # files and has no Postgres client library, so it must not hold
          # these credentials. Valkey never uses them either.
          env:
            DB_HOSTNAME: immich-postgres.immich.svc.cluster.local
            DB_PORT: "5432"
            DB_DATABASE_NAME: immich
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-postgres
                  key: POSTGRES_USER
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-postgres
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi

machine-learning:
  controllers:
    main:
      pod:
        annotations:
          backup.velero.io/backup-volumes-excludes: cache
      containers:
        main:
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: immich-ml-cache
