initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.2
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: gammons-velero-homelab
      default: true
      config:
        region: us-east-1
  defaultVolumesToFsBackup: true

snapshotsEnabled: false
deployNodeAgent: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    autodetect: true

schedules:
  homelab-daily:
    schedule: "0 6 * * *"
    template:
      ttl: 168h
      # Deny-list rather than allow-list: a new namespace is backed up by
      # default instead of being silently unprotected until someone remembers
      # to add it. Previously this covered 6 of ~31 namespaces, omitting
      # monitoring, truelist-staging (mariadb + redis), infra and others.
      excludedNamespaces:
        - kube-system
        - kube-public
        - kube-node-lease
        - velero
        # Both of these have been Terminating for 2y+; backing them up only
        # produces errors.
        - longhorn-system
        - signoz
