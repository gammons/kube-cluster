# Calibration for the Tapo C113 view of the Neptune T-10 meter.
# Coordinates other than meter_crop are in the deskewed meter crop.
# Regenerate with: python -m water_meter.calibrate <frame.jpg> config.yaml <out_dir>
calibration:
  rotation_deg: 12.0
  meter_crop: [780, 550, 500, 500]
  digit_boxes:
    - [10, 20, 22, 32]
    - [42, 20, 22, 32]
    - [74, 20, 22, 32]
    - [106, 20, 22, 32]
    - [138, 20, 22, 32]
    - [170, 20, 22, 32]
    - [202, 20, 22, 32]
    - [234, 20, 22, 32]
  dial_center: [290, 330]
  hub_radius: 12
  rim_radius: 90
  zero_angle_deg: 0

tuning:
  wheel_units: 0.1
  needle_units_per_rev: 1.0
  consistency_tolerance: 0.3
  jitter_gal: 0.02
  max_gpm: 25
  recovery_minutes: 10
  recovery_agree_gal: 1.0
  still_threshold_gal: 0.01
  still_window_minutes: 15
  flow_window_minutes: 5
  stale_minutes: 5
  min_digit_confidence: 0.6
  sample_interval_s: 15
