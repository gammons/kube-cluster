apiVersion: v1
data:
  config.yaml: |
    # Calibration for the Tapo C113 view of the Neptune T-10 meter.
    # Coordinates other than meter_crop are in the deskewed meter crop.
    # Regenerate with: python -m water_meter.calibrate <frame.jpg> config.yaml <out_dir>
    calibration:
      rotation_deg: 12.0
      meter_crop: [830, 600, 420, 420]
      digit_boxes:
        - [60, 104, 20, 32]
        - [92, 104, 20, 32]
        - [122, 104, 20, 32]
        - [155, 104, 20, 32]
        - [189, 104, 20, 32]
        - [221, 105, 20, 32]
        - [256, 105, 20, 32]
        - [289, 104, 20, 32]
      dial_center: [242, 242]
      hub_radius: 11
      rim_radius: 78
      zero_angle_deg: 0

    tuning:
      wheel_units: 0.1
      needle_units_per_rev: 0.1
      consistency_tolerance: 0.3
      jitter_gal: 0.02
      max_gpm: 25
      recovery_minutes: 10
      confirm_jump_gal: 1.0
      confirm_samples: 3
      still_threshold_gal: 0.01
      still_window_minutes: 15
      flow_window_minutes: 5
      stale_minutes: 5
      min_digit_confidence: 0.6
      digit_shift_px: 1
      digit_shift_agree: 0.5
      burst_frames: 5
      burst_agree_gal: 0.05
      sample_interval_s: 15
kind: ConfigMap
metadata:
  name: water-meter-config
  namespace: water-meter
