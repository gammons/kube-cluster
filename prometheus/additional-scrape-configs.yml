# Production cluster metrics via Tailscale egress
- job_name: 'production-truelist-prometheus-exporter'
  static_configs:
    - targets:
      - 'production-truelist-app.monitoring.svc.cluster.local:9394'
      labels:
        cluster: 'production'
        environment: 'prod'
        service: 'truelist-app'
  scrape_interval: 30s
  metrics_path: /metrics

- job_name: 'production-redis-main'
  static_configs:
    - targets:
      - 'production-redis-main.monitoring.svc.cluster.local:9121'
      labels:
        cluster: 'production'
        environment: 'prod'
        service: 'redis-main'
  scrape_interval: 30s
  metrics_path: /metrics

- job_name: 'production-redis-cache'
  static_configs:
    - targets:
      - 'production-redis-cache.monitoring.svc.cluster.local:9121'
      labels:
        cluster: 'production'
        environment: 'prod'
        service: 'redis-cache'
  scrape_interval: 30s
  metrics_path: /metrics

- job_name: 'production-kube-state-metrics'
  static_configs:
    - targets:
      - 'production-kube-state-metrics.monitoring.svc.cluster.local:8080'
      labels:
        cluster: 'production'
        environment: 'prod'
        service: 'kube-state-metrics'
  scrape_interval: 30s
