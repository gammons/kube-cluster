# Proxmox hypervisor host (pve) - ZFS pool health, SMART wear, host metrics
# Added 2026-09-12. zpool_* metrics come from a textfile collector because
# node_exporter's built-in zfs collector does not expose pool health.
- job_name: 'proxmox-host'
  static_configs:
    - targets:
      - '192.168.5.1:9100'
      labels:
        cluster: 'homelab'
        environment: 'homelab'
        service: 'node-exporter'
        node: 'pve'
        role: 'hypervisor'
  scrape_interval: 30s
  metrics_path: /metrics
