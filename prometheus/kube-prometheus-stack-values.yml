additionalPrometheusRulesMap: {}
alertmanager:
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/alertmanager-slack-webhook/
    # Holds the Slack incoming-webhook URL so it stays out of git.
    # Create with:
    #   kubectl create secret generic alertmanager-slack-webhook -n monitoring \
    #     --from-literal=slack-api-url='https://hooks.slack.com/services/...'
    secrets:
      - alertmanager-slack-webhook
    replicas: 1
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: local-path
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/slack-api-url
    inhibit_rules:
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = "critical"
      target_matchers:
      - severity =~ "warning|info"
    - equal:
      - namespace
      - alertname
      source_matchers:
      - severity = "warning"
      target_matchers:
      - severity = "info"
    receivers:
    - name: "null"
    - name: slack-alerts
      slack_configs:
      - actions:
        - text: 'View in Prometheus :mag:'
          type: button
          url: '{{ (index .Alerts 0).GeneratorURL }}'
        channel: '#alerts'
        color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical"
          }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'
        send_resolved: true
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Cluster:* {{ .Labels.cluster }}
          *Severity:* {{ .Labels.severity }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Status:* {{ .Status }}
          {{ end }}
        title: 'Alert: {{ .GroupLabels.alertname }}'
    route:
      group_by:
      - namespace
      - alertname
      - cluster
      group_interval: 5m
      group_wait: 30s
      receiver: "null"
      repeat_interval: 12h
      routes:
      - matchers:
        - alertname = "Watchdog"
        receiver: "null"
      - matchers:
        - cluster = "ovh"
        - severity = "critical"
        receiver: slack-alerts
        repeat_interval: 4h
      - matchers:
        - cluster = "ovh"
        - severity = "warning"
        receiver: slack-alerts
        repeat_interval: 12h
      # Homelab alerts -> Slack. These MUST precede the catch-all null route
      # below; Alertmanager takes the first matching route.
      # 2026-09-12: homelab alerts were all discarded, which is why a DEGRADED
      # zpool went unnoticed for weeks.
      - matchers:
        - cluster =~ "homelab|local|local-k3s"
        - severity = "critical"
        receiver: slack-alerts
        repeat_interval: 4h
      # 2026-09-13: widened to warnings. A VeleroBackupPartiallyFailed warning
      # named the exact cause of a backup failure 4h before the critical
      # "no successful backup" alert fired, but was being discarded.
      - matchers:
        - cluster =~ "homelab|local|local-k3s"
        - severity = "warning"
        receiver: slack-alerts
        repeat_interval: 12h
      # info/none severity still discarded (also catches anything unlabelled).
      - matchers:
        - cluster =~ "homelab|local|local-k3s"
        receiver: "null"
  enabled: true
defaultRules:
  create: true
  rules:
    alertmanager: true
    configReloaders: true
    etcd: false
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubeProxy: false
    kubelet: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
grafana:
  adminPassword: changeme123!
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - access: proxy
        isDefault: true
        name: Prometheus
        type: prometheus
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
      - access: proxy
        jsonData:
          maxLines: 1000
        name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
      - database: clearlist_prod
        jsonData:
          connMaxLifetime: 14400
          maxIdleConns: 2
          maxOpenConns: 5
        name: MySQL
        secureJsonData:
          password: fS+aln6Nk3DSM2mCjMMoqrJVps/w41Dq
        type: mysql
        url: ovh-mysql-replica-grafana.monitoring.svc.cluster.local:3306
        user: grafana
  enabled: true
  ingress:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    enabled: true
    hosts:
    - grafana.local.grant.dev
    ingressClassName: traefik
    path: /
    pathType: Prefix
    tls:
    - hosts:
      - grafana.local.grant.dev
      secretName: grafana-local-grant-dev-tls
  persistence:
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 10Gi
    storageClassName: local-path
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  sidecar:
    alerts:
      enabled: true
      label: grafana_alert
      labelValue: "1"
      searchNamespace: monitoring
    dashboards:
      enabled: true
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
      searchNamespace: ALL
    datasources:
      enabled: false
      searchNamespace: ALL
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
prometheus:
  enabled: true
  prometheusSpec:
    additionalScrapeConfigsSecret:
      enabled: true
      key: prometheus-additional.yaml
      name: additional-scrape-configs
    affinity: {}
    enableRemoteWriteReceiver: true
    externalLabels:
      cluster: homelab
      region: local
    podMonitorSelectorNilUsesHelmValues: false
    replicas: 1
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi
    retention: 14d
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
          storageClassName: local-path
    walCompression: true
prometheus-node-exporter:
  hostRootFsMount:
    enabled: false
prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false
  enabled: true
  hostNetwork: false
  tls:
    enabled: false
